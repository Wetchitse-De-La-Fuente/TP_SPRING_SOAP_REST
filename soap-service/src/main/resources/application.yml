server:
  port: 8081
spring:
  application:
    name: soap-service
  webservices:
    path: /ws
  datasource:
    url: 'jdbc:h2:file:./data/personnes;DB_CLOSE_ON_EXIT=FALSE'
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
